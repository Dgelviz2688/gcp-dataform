name: Dataform compile

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dataform CLI
        run: npm install -g @dataform/cli@3

      - name: Compilar el grafo (valida SQLX, JS, refs y dependencias)
        run: dataform compile
